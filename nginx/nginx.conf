events {}
http {
    server {
        listen 80;

        # <<--Rutas de Central PET (Flask - hackathon_api)-->>
        # <<--NGINX INTERCEPTA /test y lo envía al puerto 5001-->>
        location /test {
            proxy_pass http://host.docker.internal:5001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # <<--Rutas de Artesanas (FastAPI - artesaniasApp_backend)-->>
        # <<--NGINX INTERCEPTA /api/ y lo envía al contenedor del backend-->>
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # <<--FRONTEND (Next.js - artesaniasApp_frontend)-->>
        # El resto se envía a la PWA de Artesanías
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}