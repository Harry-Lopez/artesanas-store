events {}
http {
    server {
        listen 80;

        # 1. Rutas de Central PET (Flask - hackathon_api)
        # NGINX intercepta /test y lo envía al puerto 5001 de su servidor
        location /test {
            proxy_pass http://host.docker.internal:5001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. Rutas de Artesanas (FastAPI - artesaniasApp_backend)
        # NGINX intercepta /api/ y lo envía al contenedor del backend
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Interfaz Visual (Next.js - artesaniasApp_frontend)
        # Todo lo demás se envía a la PWA de Artesanías
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}